# Which generator produces code for a run, and with what model.
#
# THIS FILE IS THE ONLY PLACE IN THIS REPOSITORY WHERE A TENANT IS NAMED IN A WAY THE
# RUNTIME READS. That is the point of it. ADR-0001 requires the package to be
# domain-agnostic and CI fails the build when `agentic_control_plane/` or `tests/`
# carries tenant vocabulary, so the routing table is data and the resolver that reads
# it (`agentic_control_plane/specialists.py`) knows nothing about what is in it.
#
# Schema, resolution rules and the reasoning behind both: docs/adr/0016.
#
# Override the whole file with SPECIALIST_ROUTING_FILE to route a deployment
# differently without rebuilding the image. Delete it, or mount an empty path over it,
# and every run takes `default` below - which is exactly the behaviour this repository
# had before routing existed.

version: 1

specialists:
  # The general-purpose generator built into the Coder node: one `claude` CLI call
  # asking for a {path: contents} object. `model` and `cli_timeout_seconds` were
  # module constants in nodes/coder.py until ADR-0016; the values here are those
  # constants, unchanged, because a routing refactor must not change what a working
  # deployment does. `default` is required, must be `builtin`, and is what any target
  # with no matching route below resolves to.
  default:
    kind: builtin
    model: claude-sonnet-5
    # 300s was too tight for a retry prompt covering several files - a genuine timeout
    # (not a hang) was observed during brownfield fixture capture.
    cli_timeout_seconds: 480

  # A legacy-modernization specialist: a separately released tool with two bounded
  # subcommands, its own prompts and model configuration, and its own build-and-heal
  # loop. Not a prompt variation on the generator above - a different program.
  #
  # `requires` is not aspirational. It is the provisioning list that repository's
  # ADR-0055 named for whatever invokes it, and this image (python:3.12-slim) carries
  # none of it. The resolver checks these before invoking anything and reports what is
  # absent by name; a specialist-capable deployment is a customised image, not a
  # config toggle.
  #
  # `distribution` is the pinned requirement ADR-0055 decided, and it is a real tag rather
  # than a placeholder: `v0.4.8`, cut 2026-09-08. Verified from a clean virtualenv before
  # being written here - the CLI starts, reads its own packaged prompts and Java baseline
  # with no checkout on any path, and that baseline's Maven wrapper resolves.
  #
  # **v0.4.0 rather than v0.3.1, because v0.3.1 has no gate at all.** Every tag before this one
  # shipped a *rule* meant to stop one defect and reported nothing about whether the generated
  # code was right; three defects reached `card-service` past a gate whose sentence was
  # "Generated and compiled 4 processor step(s)." v0.4.0 is the first that checks.
  #
  # Two mechanisms, and what each is worth stated rather than implied. `generate` renders a JUnit
  # equivalence test beside each processor and runs it (that specialist's ADR-0065) - it catches a
  # computed value that is discarded, a wrong rounding mode, and a zero-rate row that emits a
  # transaction, and it does **not** catch the WS-TOTAL-INT accumulator, which is a cross-row sum a
  # per-row table cannot express. And `generate` now renders the job wiring (ADR-0066/0067), so the
  # project it produces builds and runs, and the record-level differential returns a verdict
  # instead of `not_run` for the first time.
  #
  # **Expect `equivalence: mismatched` for CBACT04C, permanently, from a correct run.** Three
  # account fields diverge because the COBOL's own account-break post sits in a branch its loop
  # never reaches, and the generated job reproduces that faithfully. The verdict names the record
  # and the fields. Reading the word alone and concluding the generated code is wrong is the
  # misreading this paragraph exists to prevent.
  #
  # Verified by interrogating the installed artifact for the *mechanism* rather than the version,
  # which is the check v0.3.0 taught: 9 of 9 for v0.4.1, including that the resolver reads
  # `computed_fields`, that `run_generate` both renders and runs the test, and that the oracle
  # ships in the wheel.
  #
  # **v0.4.2's interrogation is functional rather than textual, and that is v0.3.0's lesson taken
  # one step further.** A grep proves a line shipped, and v0.3.0's line shipped and never fired. So
  # these twelve build a design and call the code: `aggregation_blockers` returns empty for a
  # carried value, `aggregation_source` resolves the break, `plan_steps` plans no tasklet,
  # `_has_file_source` answers False for a composite carrying a computed value, the ADR-0070 refusal
  # both fires on a `writer`-typed transform and stays silent on a correct design, and for ADR-0071
  # only a processor is a chunk step, `STEP_NAMES` omits a non-chunk step, and a role exclusion is
  # not reported as skipped. 12 of 12 from a clean virtualenv install of the tag, and again inside
  # the built image.
  #
  # One of these checks was *changed* rather than carried forward: it asserted that a tasklet
  # appears in the skip list with its role in the reason, which is exactly the behaviour ADR-0071
  # reverses. Left alone it would have failed for the right reason and read as a regression.
  #
  # **v0.4.8 rather than v0.4.7, and it is the first tag whose delivered artifact can be checked
  # where it lands.** Everything this pipeline verifies -- the compile, the rendered job's run, the
  # differential against the COBOL oracle -- happens inside the specialist container, which then
  # discards the workspace. The output repository re-checked none of it, and had **never run a
  # workflow at all**: no `.github/` on any branch, `actions/runs` reporting `total_count: 0`. Four
  # projects had been delivered that way, so the only evidence any of them built was a log line on
  # a machine that no longer had the code.
  #
  # ADR-0077 puts `.github/workflows/build.yml` in the baseline template. `verify` rather than
  # `test`, because `BaselineStackTest` is the check that the Spring context can start at all;
  # through `./mvnw` on the JDK the pom pins, both asserted against the pom rather than restated;
  # and deliberately without `-Dsurefire.failIfNoSpecifiedTests=false`, which ADR-0075 measured as
  # making a build that matched no test exit 0 exactly like one that passed.
  #
  # **The packaging glob was the part that would have failed silently.** `data/templates/**/*` does
  # not descend into a dot-directory -- that is how every wheel before ADR-0058 shipped without
  # `.mvn/wrapper/maven-wrapper.properties`, leaving `./mvnw` exiting 1 before Maven started -- so
  # `.github/workflows/*` needs its own line. Without it this release would have looked complete
  # and shipped a template with no workflow in it.
  #
  # Interrogated functionally, **37 of 37**, from a clean virtualenv install of `v0.4.8` and again
  # inside the rebuilt image -- the thirty-three v0.4.7 carried plus four for ADR-0077. The one
  # that matters reads the workflow out of `site-packages` and materialises a project through
  # `materialize_target_project` rather than listing a directory, because a check reading the
  # repository would have stayed green through exactly the failure this release prevents.
  #
  # **This entry claims nothing about a delivered build passing.** The workflow has never run on a
  # hosted runner. It is correct by construction and by four checks, and none of those is a green
  # build; if `BaselineStackTest`'s Testcontainers requirement is not satisfiable there, ADR-0077
  # says it is the record to amend. Branches delivered before this tag gain nothing retroactively.
  #
  # **v0.4.7 rather than v0.4.6, and it is the first tag that will not build a job which reads
  # fewer files than its COBOL names.** The entry below predicted this: both live `CBACT04C`
  # designs bound three of the program's five files, and it said a `mismatched` from v0.4.6 was at
  # least as likely to be about the two files the job never opened as about the arithmetic. It was
  # not a prediction about one design. **All three** live designs ever written for this program
  # carry the same shape -- the join written as its own step, `TranCatBal -> TranCatBalWithAccount`
  # -- and a rendered processor has one method, `process(item)`, and no way to open a file.
  #
  # ADR-0076 closes it. `unsupplied_components` names the keyed-lookup entities a step's output
  # promises and its input lacks, with the `ASSIGN TO` each comes from. `plan_steps` reports them
  # as a skip naming the files and the move; `render_job_wiring` **raises**, reaching
  # `WiringVerdict(status="refused")`.
  #
  # **Refused rather than skipped, and that was measured rather than argued.** Left out, the join
  # takes the job's driving input with it: bindings collapse to `acctfile` and `transact`, losing
  # `TCATBALF`, and `computeMonthlyInterest` reads a staging store whose producer is gone. It
  # still compiles and starts. A run of that job reports a differential about files it never
  # opened, which is worse than the defect being fixed.
  #
  # **Only keyed lookups count.** A component the step computes is ordinary work -- a step that
  # builds a `Tran` and carries it out is not a join. A first version of the check counted every
  # added component and refused the interest calculation itself: 39 tests failing against 9, and
  # `is_keyed_lookup` is the whole of the difference.
  #
  # **The renderer needed no new capability.** Folding the resolve steps into the step that
  # consumes their output binds five of five and renders a four-path reader, with nothing changed
  # in the reader or the bindings. Only the design shape was ever in the way, which is why the
  # other half of this release is prompt `v1_6_0` stating the rule -- the two-halves shape every
  # version since `v1_1_0` has used.
  #
  # **This release introduced one regression and fixed it.** A skip that no reordering clears made
  # ADR-0072's refusal go silent, because its move search looks for a move after which nothing is
  # skipped. That search now weighs only the skips a move could fix, and an interrogation check
  # asserts it -- an artifact carrying ADR-0076 with a silenced ADR-0072 would pass every ADR-0076
  # check.
  #
  # **This entry predicts nothing about the differential, and for a new reason.** No live run has
  # ever been made against a design that binds all five files, so there is no measured baseline for
  # one. What is claimed is narrower: the job that runs will have opened every file its COBOL
  # names, or it will not have been built.
  #
  # Interrogated functionally, **33 of 33**, from a clean virtualenv install of `v0.4.7` -- the
  # twenty-seven v0.4.6 carried plus six for ADR-0076, built on renamed entities (`Driver`,
  # `Widget`, `WIDGETFILE`) rather than `CBACT04C`'s own, so an implementation that only knew the
  # string `XREFFILE` fails them. Two inherited checks were **changed rather than carried
  # forward**: both pinned `PROMPT_VERSION == "v1_5_0"`, and left alone they failed while their own
  # detail lines read `rule present=True` -- the same false-regression shape as the v0.4.5 tasklet
  # check.
  #
  # One of the six caught a false pass in itself before it shipped: written first without a step to
  # consume the joined item, `plan_steps` refused it as a dead end and the wiring check -- which
  # asserted only the step name -- went green on a refusal that had nothing to do with ADR-0076.
  #
  # **v0.4.6 rather than v0.4.5, and it is the first tag whose pipeline runs what it generated.**
  # Every tag before this one produced a job and stopped: `generate` called `compile_project` with
  # `goal="compile"` and returned, so nothing staged the oracle's inputs and nothing executed the
  # built job. `compare_project_output` has been able to return a verdict since ADR-0064 and had
  # never returned one, on any run -- including `step58-cbact04c-20260907-085235`, which rendered
  # **6 of 6** steps and reported every renderable step wired.
  #
  # ADR-0075 closes that. `generate` stages the oracle's inputs, renders a runner named from the
  # design, and runs it narrowed with `-Dtest=` -- not `goal="verify"`, which is what runs the job
  # in the hand-written round trip and would make this verdict depend on `BaselineStackTest`, the
  # `@SpringBootTest @Testcontainers` the baseline template ships. A new `JobRunVerdict` reports it,
  # separate from the differential's, because `not_run` is the same sentence for a job that abended,
  # a context that could not start, and a pipeline that never tried.
  #
  # **This entry predicts nothing about the differential, and there is a stated reason to expect
  # less than a match.** Both live `CBACT04C` designs bind **three** of the program's five files:
  # `XREFFILE` and `DISCGRP` are declared, resolvable, and bound to nothing, and every rendered
  # processor is constructed with no arguments, so the steps meant to attach the account, the card
  # cross-reference and the interest rate can read none of them. The renderer supports that join
  # when a step's `input_type` is the composite; both models wrote the bare entity instead, and
  # nothing refuses it. A `mismatched` from this release is at least as likely to be about the two
  # files the job never opened as about the arithmetic -- ADR-0075's Consequences states the shape,
  # and it wants its own record.
  #
  # Interrogated functionally, 27 of 27, from a clean virtualenv install of `v0.4.6` -- the
  # twenty-three v0.4.5 carried plus four for ADR-0075, including that staging lands on the two
  # paths the differential actually opens, and that a bound input with no source is **refused**
  # rather than silently treated as an output. That last one is not a restatement: written the
  # obvious way the branch was unreachable, and the test that caught it failed on its first run.
  #
  # **v0.4.5 rather than v0.4.4, and a live run under v0.4.4 is what found it.** Run
  # `step56-cbact04c-20260906-153713` designed a correctly ordered job on the architect's *first*
  # attempt with no repair -- so v0.4.4's prompt half is answered -- and `generate` refused the
  # wiring anyway: two steps consuming one type both wanted an `ItemReader<RatedCategoryBalance>`,
  # and Spring resolves those by type.
  #
  # That refusal was right and was the shallower of two problems. A step took a file reader whenever
  # its input type happened to be assemblable from declared files, mid-chain or not, so it re-derived
  # what the step before it had produced and that step's store went unread. In `CBACT04C` the rebuild
  # has to redo the disclosure-group keyed read and its `'DEFAULT'` fallback on status `'23'` -- the
  # entire job of the step whose output it was discarding. Two steps sharing an input type was only a
  # problem because neither should have had a file reader; a passthrough turned a silent duplication
  # into a loud refusal.
  #
  # The chain outranks the file now, through one predicate the three modules that were each deciding
  # it privately all call (that specialist's ADR-0074). **This had been rendering into every job the
  # pipeline ever produced**, and 906 of that repository's tests passed with the precedence flipped,
  # because none of them asserted which reader a mid-chain step gets.
  #
  # **What is still unmeasured, stated rather than predicted.** The differential has never returned
  # a verdict on a live design. v0.4.4's entry below predicted `mismatched` and got `not_run` again,
  # for a reason nobody had looked for -- so this entry predicts nothing and says only what was
  # verified: the ordering rule is obeyed, and the wiring defect behind that run is fixed.
  #
  # Interrogated functionally, 23 of 23, from a clean virtualenv install of `v0.4.5` -- the twenty
  # v0.4.4 carried plus three for ADR-0074, including that a mid-chain step reads its predecessor
  # **while `_has_file_source` still answers True for it**, which is the precedence rather than a
  # restatement of the fact.
  #
  # **v0.4.4 rather than v0.4.3, and it closes the sentence v0.4.3 ended on.** That entry said
  # `Equivalence: NOT RUN` stands until an architect orders every processor step where its input
  # exists. It also said nothing supplies the fee step's input, and that was wrong in the one way
  # that mattered: the step three back supplies it and the step in front consumes it, returning a
  # different type. A fan-out, not a missing producer -- so a valid order exists one move away.
  #
  # The architect prompt is `v1_5_0`, which states that a step is ordered where its input exists and
  # that among steps consuming one type the step changing it comes last. The contract refuses a
  # design that breaks it and **names the move**, and refuses only where one move would wire the
  # job: an unorderable design has a real fan-out the chain cannot express, and spending that
  # specialist's one repair attempt on an instruction nothing satisfies buys nothing.
  #
  # **The design that refusal asks for did not compile, and building it is the only reason anyone
  # knew.** Staging stores were keyed by the type they carry, so a passthrough step -- one type on
  # two consecutive edges -- resolved both its ends to one bean and declared it twice. Keyed by the
  # step that fills them now (that specialist's ADR-0073). Deduplicating the parameter instead would
  # have compiled and produced a job that never terminates, because the store is one list with a
  # read cursor and the step would refill it as fast as it drained it.
  #
  # **This deployment should expect `equivalence: mismatched` for CBACT04C, not `not_run`.** The
  # three-field divergence the paragraph above describes is the correct verdict; `not_run` was the
  # symptom of a job that could not start, and that job starts now.
  #
  # Interrogated functionally, 20 of 20, from a clean virtualenv install of `v0.4.4` -- the twelve
  # v0.4.3 carried plus eight for the two new records, including that the refusal finds and names
  # the move on a misordered chain, **stays silent on a correctly ordered one**, and stays silent
  # again when no single move would wire the job. The staging checks assert both ends of a
  # passthrough land on stores before asserting the stores differ: without that the check passes
  # while the step takes a file reader and never reaches the collision.
  #
  # **v0.4.3 rather than v0.4.2, and the first run that got this far is what found it.** v0.4.2
  # rendered the first live design's wiring and produced a project that compiles and a job that
  # cannot start: it named nine steps and had beans for five, so it threw at startup on the first
  # file-open tasklet. v0.4.2 taught the planner that a tasklet and a reader are not steps and left
  # the job configuration naming every declared step - two halves of one decision, disagreeing.
  # v0.4.3 has both ask one predicate, adds `writer` to the roles that are not chunk steps, and
  # stops reporting a role exclusion as missing business logic (that specialist's ADR-0071).
  #
  # **A green compile is not a job that runs, and this deployment should not read it as one.** The
  # pre-flight for that run compiled the rendered project successfully; a Spring bean lookup fails
  # at runtime, so nothing in a build could have caught it.
  #
  # **What v0.4.3 did not do, closed by v0.4.4 above.** `Equivalence: NOT RUN` was the expected
  # verdict for CBACT04C under this tag, because the step55 design put a fee step after the one
  # that changes the item's type and the job it wired could not start. The step was named with no
  # bean, deliberately: dropping a step whose COBOL a renderer has not read is the failure that
  # field exists to prevent. Left here as the reading that was correct for v0.4.3 -- and as the
  # record of a diagnosis that was right about the outcome and wrong about the cause.
  #
  # **v0.4.2 rather than v0.4.1: the wiring had never met a design a model wrote.** Every number
  # behind v0.4.0's wiring was measured against a design that specialist's own test fixtures
  # declare, and a live design refused - then refused again after each fix, four times. An
  # aggregation could not see a value carried as a computed field; the planner never read a step's
  # `role`, so a file-open tasklet and a record-read reader were planned as chunk steps and
  # collided on one bean type; a composite carrying a computed value was called file-readable, and
  # the reader rendered three constructor arguments for a four-component record; and a plain entity
  # was wrapped in its own constructor. That specialist's ADR-0068 fixes them and ADR-0069 pins a
  # real design as a regression fixture, which is the part that keeps the fifth from being found
  # this way too.
  #
  # **What v0.4.2 does not do, and an operator should expect to see it.** The fifth defect is the
  # *design's*: a live architect typed two per-item transforms as `writer`, and a body is generated
  # for a processor and nothing else, so the job wires itself to classes that do not exist and the
  # project does not compile. ADR-0070 refuses that where the design is produced (architect prompt
  # `v1_4_0`) rather than patching the renderer - so a run on v0.4.2 either produces a correctly
  # typed design or fails at `design` with a message naming the role to use. **Neither outcome has
  # been seen from a live model yet.** The refusal is enforced and tested in both directions; that
  # a model obeys it first time is what the next run answers.
  #
  # **v0.4.1 rather than v0.4.0, and the first live run on v0.4.0 is what found it.** v0.4.0's file
  # bindings asked "does this step read a file" without first asking "is it fed by an aggregation",
  # so any design attaching a control break -- which is the shape that run's design produced, and
  # the correct shape -- refused the whole job's wiring. Caught by a pre-flight check against the
  # real design before the generate phase was spent, not by the run failing.
  #
  # **v0.3.1 rather than v0.3.0, because v0.3.0's fix did not fire.** The rule shipped and was
  # inert: it looked for the control break on the step, and the specialist attaches those *after*
  # the design is validated, so at the moment the check runs no step carries one. The run meant to
  # prove the fix was refused for the exact value the rule exists to excuse and produced no design
  # at all -- a `safe_stop` before the human gate, which is the right failure and still a wasted
  # phase. A deployment pinning v0.3.0 cannot complete a `design` phase for this program.
  #
  # **v0.3.0 rather than v0.2.0, and the reason is the run v0.2.0 produced.** v0.2.0 closed the
  # defect where a generated processor computed a value and discarded it. The first live run on
  # it then produced a second defect one level up: the processor returned the value, and set a
  # per-account running total to the current row's amount. An account with four category rows
  # would be posted the last row's interest instead of the sum. That specialist's ADR-0063
  # records why no component was at fault again - v0.2.0's rule *required* it, because the
  # accumulated value escapes the paragraph that computes it and the rule therefore demanded the
  # producing step return it, which a stateless processor can only do by inventing a total.
  # v0.3.0 excuses it there and refuses it there. A deployment pinning v0.2.0 still generates the
  # wrong total, and this service cannot see the difference: it compiles and the phase succeeds.
  #
  # **v0.2.0 rather than v0.1.2 closes a defect that survived a human approving it.** The
  # first end-to-end run against a tenant repository generated a processor that computed a
  # monthly interest and discarded it - legal Java, a clean compile, and a comment claiming
  # the value had been accumulated. No component was at fault: that repository's design
  # document had no way to express a type carrying a value no record holds, so its architect
  # designed the only expressible thing and its renderer emitted exactly what was designed.
  # Its ADR-0062 gives the design a word for such a value and refuses a step that computes
  # one it cannot return, at the point the design is produced rather than three layers later.
  # A deployment pinning v0.1.2 still produces the discarding processor, and this service
  # cannot see the difference: the artifact compiles and the phase reports success.
  #
  # **v0.1.2 rather than v0.1.1 is what makes a specialist run observable at all.** That
  # repository's ADR-0046 decided to emit OpenTelemetry spans from `call_model` and its two
  # CLI entrypoints; until its PR #104 the decision was accepted and unimplemented, and the
  # only instrumentation that existed was a local dev-harness monkey-patch loaded by
  # `langgraph dev`. This image runs the CLI, not that harness, so a deployment pinning
  # v0.1.1 emits no spans however it is configured. Tracing is off unless the environment
  # names a collector, so the pin costs nothing when it is not wanted - see
  # `docker-compose.specialist.yml` for the two variables that turn it on.
  #
  # **It says v0.1.1 rather than v0.1.0 because the difference is not cosmetic.** `v0.1.0`,
  # the first ref that repository published, was cut hours before its PR #102 merged, so the
  # tag does not contain ADR-0059: the refusal of a `step_name` Java cannot take, and the
  # `solution_architect` v1_1_0 prompt that states the rule. A deployment pinning v0.1.0
  # installs a specialist that will emit `compute-monthly-interest` and discover the problem
  # at render time, after a human has approved the design that contains it. The clean-virtualenv
  # check above is what caught it: `node_prompt_version('solution_architect')` reports the
  # version the node actually sends, and on v0.1.0 that is v1_0_0.
  #
  # `Dockerfile.specialist` takes this same string as SPECIALIST_REQUIREMENT (ADR-0017), and
  # `docker-compose.specialist.yml` passes it. The two must agree: a routing table naming a
  # tag the image did not install fails after the design gate, not before it.
  cobol-modernizer:
    kind: external
    command: cobol-modernizer
    distribution: "cobol-modernizer @ git+https://github.com/jayakumar-devaraj/agentic-sdlc-cobol-modernizer@v0.4.8"
    phases:
      design:
        # `--programs` is REQUIRED by this specialist, and control-plane cannot supply it.
        # ADR-0018 fixes what control-plane appends at four flags, and a COBOL program name is
        # tenant vocabulary that ADR-0001 forbids the package from carrying. So it lives here,
        # as data - which is exactly what per-phase `args` is for. See ADR-0023.
        #
        # Found by running it, 2026-08-28. The first real invocation exited 2 in three seconds
        # with `error: the following arguments are required: --programs`, before a single model
        # call. Every test that predates it drove a stand-in accepting the four flags and asking
        # for nothing else, so both sides looked complete from inside themselves.
        #
        # ONE program, not the four the specialist's own `--help` shows as an example. G7 closes
        # against a named instance rather than a mechanism, and a first run migrating four
        # programs cannot say which of them the platform actually handles.
        args: [design, --programs, CBACT04C]
        requires:
          executables: [claude]
      generate:
        args: [generate]
        requires:
          # The Java baseline's own test uses Testcontainers, hence the daemon.
          #
          # **Observed 2026-08-28 and deliberately left as it is.** The first real run of this
          # phase compiled and did not test - 15 main classes, 0 test classes, no surefire
          # directory - so Testcontainers never started and the daemon went unused. Two reasons
          # not to drop the requirement on that evidence: it is the specialist's own declared
          # provisioning list (that repo's ADR-0055) and this file should not overrule another
          # repository's statement of what it needs from one observation of one version; and a
          # phase that compiles today may test tomorrow, at which point a deployment that was
          # allowed to skip the daemon fails deep inside Maven instead of at the preflight.
          #
          # It does mean the preflight currently demands something this phase does not use. That
          # is the conservative direction to be wrong in, and it is written down rather than
          # discovered. ADR-0025.
          executables: [claude, java, mvn]
          docker_daemon: true

# Matched on the target repository - the last path segment of the workspace's `origin`
# remote, minus any `.git`, compared case-insensitively. `scenario` is a label for the
# audit trail; it selects nothing. A repository may appear at most once.
routes:
  - scenario: legacy-batch-modernization
    repository: carddemo-tenant-service
    specialist: cobol-modernizer
