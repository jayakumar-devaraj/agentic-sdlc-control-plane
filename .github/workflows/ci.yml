name: ci

# One OPTIONAL repository secret: EVENTBUS_READ_PAT (ADR-0015).
#
# The agentic-events dependency lives in agentic-sdlc-eventbus, whose visibility
# changes. This workflow works either way and needs no edit when it flips:
#
#   eventbus public  -> anonymous HTTPS; a fork gets a green build with nothing set
#   eventbus private -> EVENTBUS_READ_PAT resolves it (fine-grained, read-only,
#                       scoped to that one repository)
#
# This is separate from the RUNTIME PAT the service uses to clone tenant
# repositories. CI never performs a real clone, so it needs no runtime credential.

# WHY THERE IS NO `push: branches: [main]` TRIGGER.
#
# There was, and it doubled this repository's bill for nothing. Measured across the last ten
# merged PRs: every `pull_request` run was followed by a `push main` run of the same length,
# because merging is what produced the push. GitHub already runs pull-request checks against the
# MERGE RESULT rather than the branch tip, so the tree that lands on `main` is the tree the PR
# just tested - re-testing it is paying twice for one answer.
#
# **The gap that leaves, stated rather than hidden:** the merge result is only the merged tree if
# `main` has not moved between the check and the merge. Enable branch protection's *"Require
# branches to be up to date before merging"* to close it. This platform merges one PR at a time
# (CLAUDE.md: "Only then start the next task"), so the window is already narrow, but a settings
# toggle is a better guarantee than a habit.
#
# `workflow_dispatch` is the escape hatch: run this on `main` by hand whenever that is actually
# wanted - after a settings change, or to confirm a suspicion - instead of on every merge forever.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per pull request. A second push to the same branch cancels the run the first one started
# rather than paying for both to finish - three superseded runs on one branch were observed in the
# history this was written against.
#
# The key falls back to `run_id` off a pull request, which is unique per run, so a manual
# `workflow_dispatch` is never cancelled by the next one.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The checkpointer's durability tests need a real Postgres. They are the whole
    # reason PostgresSaver was chosen over an in-memory saver, so running them
    # against a service container rather than skipping them in CI is the point.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: control_plane
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U control_plane -d control_plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          # Every run installed this repository's dependencies cold. They are pinned in
          # requirements.txt, so the wheels are identical between runs and there is nothing to
          # gain from re-downloading them.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Assert requirements.lock has not drifted
        # Pure stdlib, so it runs before anything is installed and fails in seconds when
        # someone edits a pin without regenerating the lock. Deliberately not a
        # recompile-and-diff: `uv pip compile` resolves transitive dependencies to
        # whatever is newest that morning, so a byte diff would fail for reasons having
        # nothing to do with the change under test. See the script's own docstring.
        run: python scripts/check_lock_is_current.py

      - name: Configure a git identity for the workspace tests
        # tools.git_commit_all sets a per-repo identity, but git also needs a
        # global default present on a bare runner before `git commit` will run.
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "CI"

      - name: Configure read access to the agentic-events dependency
        # Optional by design (ADR-0015). agentic-sdlc-eventbus changes visibility, and
        # this build must work either way:
        #
        #   secret set   -> git uses it, a private eventbus resolves
        #   secret unset -> anonymous HTTPS, a public eventbus resolves
        #
        # Never fails on an unset secret. An earlier version of this step (removed in
        # 080ffae) required it, which is the opposite of the requirement here.
        #
        # `-n` on the value, not just "is it defined": interpolating an unset secret
        # yields the empty string, and configuring url."https://@github.com/" is a
        # *syntactically valid* rewrite carrying an empty credential. pip's clone then
        # falls through to an interactive prompt and dies with "could not read Password"
        # on a runner with no TTY - a message pointing at nothing. That trap is why the
        # empty case must skip the config entirely rather than write it.
        env:
          EVENTBUS_READ_PAT: ${{ secrets.EVENTBUS_READ_PAT }}
        run: |
          # Trim whitespace. A value pasted into `gh secret set` or the web UI can carry a
          # trailing newline, which lands inside the URL and corrupts the credential in a
          # way no error message explains.
          EVENTBUS_READ_PAT=$(printf '%s' "$EVENTBUS_READ_PAT" | tr -d '[:space:]')

          if [ -n "$EVENTBUS_READ_PAT" ]; then
            # Report what the token can actually see, in status codes only - never the
            # token, never response bodies. This is the check that ends an argument:
            #   /user   401 -> the value is not a valid token at all
            #   /repos/... 200 -> it can read eventbus, so any later failure is not scope
            #   /repos/... 404 -> valid token, no access to that repository
            echo "--- what this token can see (status codes only) ---"
            code_user=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${EVENTBUS_READ_PAT}" https://api.github.com/user)
            code_repo=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${EVENTBUS_READ_PAT}" \
              https://api.github.com/repos/jayakumar-devaraj/agentic-sdlc-eventbus)
            # **/repos needs only Metadata:Read. /contents needs Contents:Read, which is
            # what git clone actually requires.** A token holding Metadata but not
            # Contents answers 200 here and "Repository not found" to git - the exact
            # contradiction that sent this chase through three wrong diagnoses. So the
            # permission git needs is probed directly rather than inferred from the one
            # that is easier to check.
            code_contents=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${EVENTBUS_READ_PAT}" \
              https://api.github.com/repos/jayakumar-devaraj/agentic-sdlc-eventbus/contents/)
            echo "GET /user                                  -> $code_user   (token valid at all?)"
            echo "GET /repos/...                             -> $code_repo   (Metadata: Read)"
            echo "GET /repos/.../contents/                   -> $code_contents   (Contents: Read <- git needs THIS)"
            echo "token length: ${#EVENTBUS_READ_PAT}"

            if [ "$code_repo" = "200" ] && [ "$code_contents" != "200" ]; then
              echo "::error::The token has Metadata: Read but NOT Contents: Read. Git clone \
          requires Contents, which is why the API can see this repository and git cannot. On \
          the token's page the setting is 'Repository permissions > Contents: Read-only' - if \
          it already appears set, it was most likely never saved, since editing a \
          fine-grained token requires pressing Save on that section specifically."
              exit 1
            fi

            # **Pick the credential form by testing it, not by believing something about
            # it.** An earlier version asserted that fine-grained PATs reject the bare
            # `<token>@host` form and switched away from it on that basis. The assertion
            # was never checked, and while it was in place the API said 200 for this very
            # repository while git said "Repository not found" - a contradiction that can
            # only be the transport, not the token.
            #
            # **`bare` is tried first because it is the one that works** - measured
            # 2026-08-26. It is also the form 080ffae used all along, which an earlier
            # commit here "fixed" to x-access-token on an unverified claim that
            # fine-grained PATs reject it. The claim was wrong; x-access-token is the form
            # that fails. The others remain as a fallback so a change in GitHub's
            # behaviour is survived rather than asserted about.
            #
            # **actions/checkout writes a credential into the repo-LOCAL .git/config**, as
            # `http.https://github.com/.extraheader` carrying the repo-scoped GITHUB_TOKEN.
            # Local config beats global, so every git command run inside the workspace -
            # including pip's clone - authenticates as that token, which by design cannot
            # see any other repository. That is the whole explanation for an API that says
            # 200 and a git that says "Repository not found", and it outranks every
            # hypothesis about the token that was chased before it.
            echo "--- repo-local credential left by actions/checkout ---"
            git config --local --get-regexp '^http\.' | sed 's/AUTHORIZATION.*/AUTHORIZATION: <redacted>/' || echo "(none)"
            git config --local --unset-all "http.https://github.com/.extraheader" 2>/dev/null || true
            echo "removed it; the global credential below now applies"

            REWRITE_OK=0
            for form in bare extraheader x-access-token; do
              git config --global --remove-section "http.https://github.com/" 2>/dev/null || true
              git config --global --unset-all "url.https://x-access-token:${EVENTBUS_READ_PAT}@github.com/.insteadOf" 2>/dev/null || true
              git config --global --unset-all "url.https://${EVENTBUS_READ_PAT}@github.com/.insteadOf" 2>/dev/null || true
              case "$form" in
                extraheader)
                  git config --global "http.https://github.com/.extraheader" \
                    "Authorization: Bearer ${EVENTBUS_READ_PAT}" ;;
                bare)
                  git config --global "url.https://${EVENTBUS_READ_PAT}@github.com/.insteadOf" \
                    "https://github.com/" ;;
                x-access-token)
                  git config --global "url.https://x-access-token:${EVENTBUS_READ_PAT}@github.com/.insteadOf" \
                    "https://github.com/" ;;
              esac
              if GIT_TERMINAL_PROMPT=0 git ls-remote \
                  https://github.com/jayakumar-devaraj/agentic-sdlc-eventbus.git >/dev/null 2>&1; then
                echo "credential form '$form' works - keeping it"
                REWRITE_OK=1
                break
              fi
              echo "credential form '$form' did not authenticate"
            done
            if [ "$REWRITE_OK" != "1" ]; then
              echo "::error::EVENTBUS_READ_PAT is a valid token that the API accepts for this \
          repository, but no git credential form authenticated with it. That is a transport \
          problem rather than a token problem - see the status codes printed above."
              exit 1
            fi
            echo "PAT_SET=1" >> "$GITHUB_ENV"
          else
            echo "EVENTBUS_READ_PAT is not set - relying on anonymous access"
            echo "PAT_SET=0" >> "$GITHUB_ENV"
          fi

      - name: Assert the shared contract package is reachable
        # Runs AFTER the step above, so it tests reachability with whatever credential
        # is actually configured - which is what makes its two error messages able to
        # tell "the repo is private and nothing is set" from "the token is wrong".
        #
        # It exists because pip's own failure is `fatal: could not read Username for
        # 'https://github.com'`, which names neither the repository nor the setting that
        # caused it. That cost nine minutes and a wrong first diagnosis on 2026-08-26 -
        # the stale `jayakumard10` owner in the URL looks like the culprit and is not,
        # since the rename redirect resolves fine. This costs about a second.
        run: |
          URL=$(grep -oE 'https://github\.com/[^@]+\.git' requirements.txt | head -1)
          echo "checking access to $URL"
          # GIT_TERMINAL_PROMPT=0 so a private repo fails immediately instead of blocking
          # on a username prompt - the same thing that makes pip's own error so unhelpful.
          export GIT_TERMINAL_PROMPT=0

          # Show what git was actually configured to do. Secrets are masked as *** in
          # Actions logs, so this reveals whether the rewrite exists without revealing
          # the token. An earlier version of this step swallowed git's stderr entirely
          # and asserted a cause with no evidence for it - which is how a check ends up
          # confidently naming the wrong thing.
          echo "--- configured url rewrites ---"
          git config --global --get-regexp '^url\.' || echo "(none configured)"
          echo "--- git ls-remote ---"
          # Capture stderr so the branch below can read *which* refusal this was. The two
          # look alike and mean opposite things, and telling them apart is the difference
          # between regenerating a token and editing its repository access.
          if err=$(git ls-remote "$URL" 2>&1 >/dev/null); then
            echo "reachable"
          elif [ "$PAT_SET" = "1" ]; then
            echo "$err"
            if echo "$err" | grep -qi "not found"; then
              # GitHub answers 404, not 403, for a repository a fine-grained token cannot
              # see - deliberately, so it does not leak whether the repo exists. So this
              # is NOT an auth failure: the credential was accepted. The token simply has
              # no access to this repository.
              echo "::error::The token in EVENTBUS_READ_PAT authenticated successfully, \
          but has no access to agentic-sdlc-eventbus - GitHub answers 'Repository not \
          found' rather than 'denied' for a repo a fine-grained token cannot see, so this \
          is a SCOPE problem and not an expiry or credential problem. Do not regenerate \
          it. Edit the token at Settings > Developer settings > Fine-grained tokens: set \
          Repository access to 'Only select repositories' and include \
          agentic-sdlc-eventbus, with Contents: Read-only. The default, 'Public \
          repositories', cannot see a private repo, which is the usual cause."
            else
              echo "::error::The token in EVENTBUS_READ_PAT was rejected outright \
          ('Invalid username or token' or similar), so the credential itself is bad - \
          expired, revoked, or malformed. This one does need regenerating, unlike the \
          'Repository not found' case."
            fi
            exit 1
          else
            echo "::error::$URL is not readable anonymously and EVENTBUS_READ_PAT is not \
          set, so agentic-sdlc-eventbus is private with no credential available. Either \
          set that secret (fine-grained, read-only, scoped to that repo) under Settings > \
          Secrets and variables > Actions, or make the repository public. Either works - \
          see ADR-0015. Without one, the install below fails with a misleading 'could not \
          read Username' error that names none of this."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Assert the tiers partition the suite
        # Cheap (collect-only, about a second) and it catches the one regression the
        # tier split can suffer silently: a test that belongs to no tier, or to two.
        #
        # tests/conftest.py already raises a UsageError for a file outside
        # tests/{unit,contract,integration,evaluation}/, so this is not the stray check -
        # it is the arithmetic. If the marker-filtered total ever differs from the
        # unfiltered total, some test is invisible to every marker-selected run that
        # might be added later, and the "passed" count will not say so.
        run: |
          # Collection runs to a FILE and its exit code is read from $?, never inferred
          # from a pipeline. `x=$(pytest ... | tail -1)` returns tail's status, not
          # pytest's, so a collection error would leave both counts empty, compare equal,
          # and pass this step green having proved nothing.
          pytest --co -q > /tmp/all.txt; all_rc=$?
          pytest -m "unit or contract or integration or evaluation" --co -q             > /tmp/tiered.txt; tiered_rc=$?
          if [ $all_rc -ne 0 ] || [ $tiered_rc -ne 0 ]; then
            echo "::error::collection itself failed (exit $all_rc / $tiered_rc)"
            tail -20 /tmp/all.txt; tail -20 /tmp/tiered.txt
            exit 1
          fi

          ALL=$(tail -1 /tmp/all.txt | grep -oE '^[0-9]+')
          TIERED=$(tail -1 /tmp/tiered.txt | grep -oE '^[0-9]+')
          echo "unfiltered=$ALL  tiered=$TIERED"

          # An empty count means the summary line was not what this expects, which is a
          # broken check rather than a passing one.
          case "$ALL$TIERED" in ''|*[!0-9]*) echo "::error::could not read the collected           counts; this step needs fixing rather than ignoring"; exit 1 ;; esac

          if [ "$ALL" != "$TIERED" ]; then
            echo "::error::$((ALL - TIERED)) test(s) belong to no tier; a marker-filtered           run would never execute them"
            exit 1
          fi

      - name: Run tests with coverage
        # ONE full run, deliberately - not a job per tier. This repository is private,
        # so Actions minutes come out of the account allowance rather than being free
        # the way they are on a public repo. Running the tiers as separate jobs would
        # multiply the bill to produce the same answer this single run already gives,
        # and coverage has to be measured over the whole suite anyway.
        #
        # Measured **94.19%** with the postgres service container attached (443 collected,
        # no skips - 2255 statements, 131 missed). The floor sits just under it so coverage
        # can only ratchet up.
        #
        # **THE FLOOR IS 93 BECAUSE 90 HAD STOPPED WORKING.** Its second job is to catch a
        # failure mode a bare `pytest` hides: without a reachable postgres the durability
        # tests skip, and a run where the service container never came up must FAIL here
        # rather than pass quietly with the property those tests exist to prove left
        # unverified.
        #
        # That guarantee had quietly lapsed. The 90 was set when the suite was 257 tests and
        # skipping dropped it to 88%. The suite has since grown to 443 and coverage grew with
        # it: skipping now leaves **91.13%** (200 missed), which is ABOVE 90 - so a
        # postgres-less run would have scored 91% and gone green. Both numbers had drifted
        # three points from the comment describing them.
        #
        # 93 restores the intent against measured values rather than remembered ones:
        #   postgres attached -> 94.19%  passes
        #   postgres missing  -> 91.13%  fails
        # Re-measure both before moving this number again.
        run: pytest --cov=agentic_control_plane --cov-report=term-missing --cov-fail-under=93

      - name: Assert every mermaid diagram parses
        # "The diagrams render on GitHub" has broken three times, and every time the
        # repository looked fine locally while GitHub showed "Unable to render rich
        # display" to anyone browsing it. Parsing is cheap and catches the whole class
        # seen so far; rendering needs a headless browser and is not worth the fragility.
        run: |
          npm install --no-fund --no-audit --no-save mermaid jsdom
          node scripts/validate-mermaid.mjs

      - name: Assert the platform carries no tenant-specific vocabulary
        # This repo is domain-agnostic by requirement, not by convention. Checked
        # here so a regression fails a build rather than waiting for review.
        #
        # Scope is the package and its tests, deliberately - not the whole repo.
        # scripts/ holds cross-repo demo tooling that must know every repository by
        # name, including tenant specifics, because demonstrating a platform needs a
        # concrete tenant to demonstrate it against. That tooling is never imported
        # by the package, which is where the rule actually applies.
        #
        # config/ is excluded for the same reason and more deliberately still: since
        # ADR-0016 the specialist routing table lives there and names tenants on
        # purpose. That is the whole design - the vocabulary is data the package reads,
        # never something the package contains.
        #
        # *** THIS IS A DENYLIST. IT ONLY CATCHES TENANTS SOMEONE REMEMBERED TO ADD. ***
        #
        # It carried only the url-shortener's words from the day it was written until
        # 2026-08-26, while this platform's second tenant - COBOL/mainframe modernization -
        # had been live for months. A green build meant "no url-shortener vocabulary",
        # never "domain-agnostic", and nothing about the green said which.
        #
        # Maintenance rule: **a tenant joining this platform adds its vocabulary here in
        # the same change.** If you are adding tenant #3, consider whether a denylist is
        # still the right shape: config/scenario_specialists.yaml now exists (ADR-0016)
        # and names every routed tenant, so these terms could be derived from the
        # specialists actually configured, which would make a new tenant loud instead of
        # silent. Deliberately not done in ADR-0016's own change - it would make a green
        # build depend on parsing a config file at lint time, which deserves its own
        # decision rather than a side effect of landing the file.
        run: |
          # Tenant 1 - url-shortener-api.
          TENANT_1='url.?shorten|shortened|short.?url|qr.?code|click.analytics'

          # Tenant 2 - COBOL/mainframe modernization (cobol-modernizer, card-service).
          #
          # `pic` is the one that needs care and it took two tries. Matched only as a real
          # picture clause - `PIC X(10)`, `PIC S9(9) COMP-3`, `PIC clause` - never bare and
          # never as `pic(`: the first draft used `pic\s*\(`, which matched **"topic("** and
          # failed the build on two existing test names. A guard that cries wolf gets
          # switched off, which would be worse than the gap this step is closing. Word
          # boundaries on the short acronyms for the same reason.
          #
          # Verified both directions before commit: eleven real COBOL forms caught, and
          # "topic(", "typical picture", "epic", "pick a value", "os.path" and "graphics
          # pipeline" all left alone.
          TENANT_2='cobol|copybook|carddemo|mainframe|\bjcl\b|\bvsam\b|\bcics\b|\bpic\s+[9xsavnzp]|\bpic\s+clause|\bz/?os\b'

          if grep -rniE "$TENANT_1|$TENANT_2" agentic_control_plane/ tests/; then
            echo "::error::tenant-specific vocabulary found in a domain-agnostic repo"
            exit 1
          fi
          echo "clean"

  compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Write local secret files for compose
        env:
          EVENTBUS_READ_PAT: ${{ secrets.EVENTBUS_READ_PAT }}
        run: |
          # postgres_password is a placeholder: nothing here authenticates with it.
          #
          # github_pat is NOT a placeholder any more (ADR-0015). It is now also a
          # *build* secret, because a private agentic-sdlc-eventbus needs a credential
          # to resolve agentic-events. So this writes the real EVENTBUS_READ_PAT when
          # one is configured, and writes an EMPTY file when one is not -- the
          # Dockerfile tests `-s` and skips the git config entirely on an empty file,
          # falling through to anonymous HTTPS. A placeholder string would be worse
          # than nothing: it is non-empty, so the build would configure git with a
          # credential that cannot authenticate.
          #
          # secrets/*.txt is gitignored, so nothing written here can be committed.
          mkdir -p secrets
          printf '%s' "$EVENTBUS_READ_PAT" > secrets/github_pat.txt
          printf 'ci_local_password' > secrets/postgres_password.txt
          if [ -s secrets/github_pat.txt ]; then
            echo "build secret present"
          else
            echo "build secret empty - anonymous build (requires a public eventbus)"
          fi

      - name: Start this service's own Postgres
        run: docker compose up -d postgres

      - name: Wait for postgres healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' agentic-sdlc-control-plane-postgres || echo starting)"
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "postgres never became healthy" >&2
          docker compose logs
          exit 1

      - name: Build the consumer image
        # Build only: the consumer needs a live event bus to do anything, and this
        # repo is independently clonable with no sibling checkout, so there is no
        # broker to point it at here. Cross-repo behaviour is verified locally
        # against a real broker instead - see the README.
        run: docker compose build consumer

      - name: Assert the built image carries no credential
        # Kept deliberately after the build-time PAT was removed. Nothing writes a
        # credential into this image today, so this passes trivially - which is the
        # point: it is a regression guard. This image is the one that handles a real
        # PAT at runtime, so a build step that quietly reintroduced one would ship
        # it, and would otherwise be caught by nobody.
        run: |
          size=$(docker run --rm agentic-sdlc-control-plane-consumer:latest \
            sh -c 'stat -c %s /root/.gitconfig 2>/dev/null || echo 0')
          echo "/root/.gitconfig is $size bytes"
          if [ "$size" != "0" ]; then
            echo "::error::build credential persisted into the image"
            docker run --rm agentic-sdlc-control-plane-consumer:latest cat /root/.gitconfig
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v

  specialist-image:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Assert the specialist deployment override says what ADR-0022 says it says
        # Runs before the builds because it needs nothing and it is the cheap half of the
        # provisioning story. ADR-0022 makes three claims about docker-compose.specialist.yml
        # that are one careless edit from being false, and a claim in a document is not a check.
        run: |
          set -eu
          BASE=docker-compose.yml
          OVERRIDE=docker-compose.specialist.yml

          # 1. The override is required to be required. `${CLAUDE_SESSION_DIR:?...}` is the only
          #    thing standing between an operator and a read-write bind mount of their live
          #    ~/.claude into a container that runs generated code (ADR-0022 section 2). Losing
          #    the `:?` would still merge cleanly, which is exactly why it needs asserting.
          if docker compose -f "$BASE" -f "$OVERRIDE" config >/dev/null 2>&1; then
            echo "::error::the override merged with CLAUDE_SESSION_DIR unset - see ADR-0022 section 2"
            exit 1
          fi
          echo "CLAUDE_SESSION_DIR is required"

          merged="$(CLAUDE_SESSION_DIR=/tmp/session docker compose -f "$BASE" -f "$OVERRIDE" config)"

          # 2. The base file's default survives the existence of an override that overrides it.
          #    ADR-0021 section 5 chose `none`, and the failure this catches is someone fixing a
          #    local deployment by editing the committed default instead of the override.
          base_only="$(docker compose -f "$BASE" config)"
          echo "$base_only" | grep -q 'PUBLISH_MODE: none' || {
            echo "::error::the default deployment no longer publishes nothing - see ADR-0021 section 5"; exit 1; }
          echo "$merged" | grep -q 'PUBLISH_MODE: pull_request' || {
            echo "::error::the specialist override no longer sets PUBLISH_MODE=pull_request - see ADR-0029"; exit 1; }
          echo "PUBLISH_MODE: none by default, pull_request under the override"

          # 3. The build-time pin and the runtime pin are the same string. They are in two files
          #    because one is read by docker build and one by the resolver; a disagreement fails
          #    the run AFTER the design gate, which is the most expensive place in this graph to
          #    find a provisioning mistake (ADR-0022 section 4).
          routed="$(sed -n 's/^ *distribution: "\(.*\)"$/\1/p' config/scenario_specialists.yaml)"
          built="$(echo "$merged" | sed -n 's/^ *SPECIALIST_REQUIREMENT: \(.*\)$/\1/p')"
          echo "routing table: $routed"
          echo "image build:   $built"
          if [ "$routed" != "$built" ]; then
            echo "::error::the routing table and the image build pin different specialists"
            exit 1
          fi
          echo "one pin, two files, same string"

      - name: Write the optional build secret
        # Both builds below install agentic-events from agentic-sdlc-eventbus, whose visibility
        # toggles. Same handling as the compose job and for the same reason (ADR-0015): the real
        # PAT when one is configured, an EMPTY file when one is not - never a placeholder, since
        # both Dockerfiles test `-s` and a non-empty dud turns a working anonymous build into a
        # failing authenticated one.
        env:
          EVENTBUS_READ_PAT: ${{ secrets.EVENTBUS_READ_PAT }}
        run: |
          mkdir -p secrets
          printf '%s' "$EVENTBUS_READ_PAT" > secrets/github_pat.txt

      - name: Build the default image
        # The base this one extends, and the control for the assertions below.
        run: |
          DOCKER_BUILDKIT=1 docker build             --secret id=github_pat,src=secrets/github_pat.txt             -t agentic-sdlc-control-plane-consumer:latest .

      - name: Assert the DEFAULT image carries no specialist runtime
        # Run first, and it is the more important of the two. ADR-0016's whole posture is that
        # the ordinary deployment cannot run a specialist and says so by name; ADR-0017 adds a
        # second image rather than growing this one. If a future change quietly moves the JDK
        # into the default Dockerfile, everything downstream still passes and the decision is
        # gone. This is what notices.
        run: |
          for tool in java mvn claude; do
            if docker run --rm agentic-sdlc-control-plane-consumer:latest                  sh -c "command -v $tool" >/dev/null 2>&1; then
              echo "::error::the default image carries $tool - see ADR-0017"
              exit 1
            fi
          done
          echo "default image is clean: no java, no mvn, no claude"

      - name: Build the specialist-capable image
        # No SPECIALIST_REQUIREMENT: this job verifies the runtime, and installing the
        # specialist itself would make a green build depend on another repository's tag
        # resolving. That belongs to the change that invokes it.
        run: |
          DOCKER_BUILDKIT=1 docker build -f Dockerfile.specialist             --secret id=github_pat,src=secrets/github_pat.txt             -t agentic-sdlc-control-plane-specialist:latest             --build-arg SPECIALIST_REQUIREMENT= .

      - name: Assert the specialist image reports the pinned versions
        # Versions, not mere presence. The generated project asserts its JDK feature version in a
        # test of its own, so an image that disagrees with the baseline produces a failure the
        # heal loop attributes to generated code.
        run: |
          set -eu
          run() { docker run --rm agentic-sdlc-control-plane-specialist:latest "$@"; }

          java_version="$(run java -version 2>&1 | head -1)"
          echo "$java_version"
          case "$java_version" in *'"25'*) ;; *) echo "::error::expected JDK 25"; exit 1 ;; esac

          mvn_version="$(run mvn -v | head -1)"
          echo "$mvn_version"
          case "$mvn_version" in *3.9.16*) ;; *) echo "::error::expected Maven 3.9.16"; exit 1 ;; esac

          claude_version="$(run claude --version)"
          echo "claude: $claude_version"

          run python -c "import agentic_control_plane; print('control plane still imports')"

      - name: Assert the specialist image carries no credential
        # Same regression guard as the default image, for the same reason: this build takes an
        # optional PAT as a BuildKit secret and must not leave it in a layer (ADR-0015).
        run: |
          size=$(docker run --rm agentic-sdlc-control-plane-specialist:latest             sh -c 'stat -c %s /root/.gitconfig 2>/dev/null || echo 0')
          echo "/root/.gitconfig is $size bytes"
          if [ "$size" != "0" ]; then
            echo "::error::build credential persisted into the specialist image"
            exit 1
          fi

      - name: Report what the capability costs
        # Reported rather than gated. A threshold here would be a number nobody can justify;
        # the delta being visible on every run is what makes a jump noticeable.
        run: |
          docker images --format '{{.Repository}}:{{.Tag}}	{{.Size}}'             | grep agentic-sdlc-control-plane
