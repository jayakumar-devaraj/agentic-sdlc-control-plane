name: ci

# One OPTIONAL repository secret: EVENTBUS_READ_PAT (ADR-0015).
#
# The agentic-events dependency lives in agentic-sdlc-eventbus, whose visibility
# changes. This workflow works either way and needs no edit when it flips:
#
#   eventbus public  -> anonymous HTTPS; a fork gets a green build with nothing set
#   eventbus private -> EVENTBUS_READ_PAT resolves it (fine-grained, read-only,
#                       scoped to that one repository)
#
# This is separate from the RUNTIME PAT the service uses to clone tenant
# repositories. CI never performs a real clone, so it needs no runtime credential.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The checkpointer's durability tests need a real Postgres. They are the whole
    # reason PostgresSaver was chosen over an in-memory saver, so running them
    # against a service container rather than skipping them in CI is the point.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: control_plane
          POSTGRES_USER: control_plane
          POSTGRES_PASSWORD: control_plane
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U control_plane -d control_plane"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5433
      POSTGRES_DB: control_plane
      POSTGRES_USER: control_plane
      POSTGRES_PASSWORD: control_plane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure a git identity for the workspace tests
        # tools.git_commit_all sets a per-repo identity, but git also needs a
        # global default present on a bare runner before `git commit` will run.
        run: |
          git config --global user.email "ci@local"
          git config --global user.name "CI"

      - name: Configure read access to the agentic-events dependency
        # Optional by design (ADR-0015). agentic-sdlc-eventbus changes visibility, and
        # this build must work either way:
        #
        #   secret set   -> git uses it, a private eventbus resolves
        #   secret unset -> anonymous HTTPS, a public eventbus resolves
        #
        # Never fails on an unset secret. An earlier version of this step (removed in
        # 080ffae) required it, which is the opposite of the requirement here.
        #
        # `-n` on the value, not just "is it defined": interpolating an unset secret
        # yields the empty string, and configuring url."https://@github.com/" is a
        # *syntactically valid* rewrite carrying an empty credential. pip's clone then
        # falls through to an interactive prompt and dies with "could not read Password"
        # on a runner with no TTY - a message pointing at nothing. That trap is why the
        # empty case must skip the config entirely rather than write it.
        env:
          EVENTBUS_READ_PAT: ${{ secrets.EVENTBUS_READ_PAT }}
        run: |
          # Trim whitespace. A value pasted into `gh secret set` or the web UI can carry a
          # trailing newline, which lands inside the URL and corrupts the credential in a
          # way no error message explains.
          EVENTBUS_READ_PAT=$(printf '%s' "$EVENTBUS_READ_PAT" | tr -d '[:space:]')

          if [ -n "$EVENTBUS_READ_PAT" ]; then
            # Report what the token can actually see, in status codes only - never the
            # token, never response bodies. This is the check that ends an argument:
            #   /user   401 -> the value is not a valid token at all
            #   /repos/... 200 -> it can read eventbus, so any later failure is not scope
            #   /repos/... 404 -> valid token, no access to that repository
            echo "--- what this token can see (status codes only) ---"
            code_user=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${EVENTBUS_READ_PAT}" https://api.github.com/user)
            code_repo=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${EVENTBUS_READ_PAT}" \
              https://api.github.com/repos/jayakumar-devaraj/agentic-sdlc-eventbus)
            echo "GET /user                                  -> $code_user"
            echo "GET /repos/jayakumar-devaraj/agentic-...   -> $code_repo"
            echo "token length: ${#EVENTBUS_READ_PAT}"

            # **Pick the credential form by testing it, not by believing something about
            # it.** An earlier version asserted that fine-grained PATs reject the bare
            # `<token>@host` form and switched away from it on that basis. The assertion
            # was never checked, and while it was in place the API said 200 for this very
            # repository while git said "Repository not found" - a contradiction that can
            # only be the transport, not the token.
            #
            # `extraheader` is listed first because it is what actions/checkout itself
            # uses, and because the same Bearer header is already proven to work above.
            REWRITE_OK=0
            for form in extraheader bare x-access-token; do
              git config --global --remove-section "http.https://github.com/" 2>/dev/null || true
              git config --global --unset-all "url.https://x-access-token:${EVENTBUS_READ_PAT}@github.com/.insteadOf" 2>/dev/null || true
              git config --global --unset-all "url.https://${EVENTBUS_READ_PAT}@github.com/.insteadOf" 2>/dev/null || true
              case "$form" in
                extraheader)
                  git config --global "http.https://github.com/.extraheader" \
                    "Authorization: Bearer ${EVENTBUS_READ_PAT}" ;;
                bare)
                  git config --global "url.https://${EVENTBUS_READ_PAT}@github.com/.insteadOf" \
                    "https://github.com/" ;;
                x-access-token)
                  git config --global "url.https://x-access-token:${EVENTBUS_READ_PAT}@github.com/.insteadOf" \
                    "https://github.com/" ;;
              esac
              if GIT_TERMINAL_PROMPT=0 git ls-remote \
                  https://github.com/jayakumar-devaraj/agentic-sdlc-eventbus.git >/dev/null 2>&1; then
                echo "credential form '$form' works - keeping it"
                REWRITE_OK=1
                break
              fi
              echo "credential form '$form' did not authenticate"
            done
            if [ "$REWRITE_OK" != "1" ]; then
              echo "::error::EVENTBUS_READ_PAT is a valid token that the API accepts for this \
          repository, but no git credential form authenticated with it. That is a transport \
          problem rather than a token problem - see the status codes printed above."
              exit 1
            fi
            echo "PAT_SET=1" >> "$GITHUB_ENV"
          else
            echo "EVENTBUS_READ_PAT is not set - relying on anonymous access"
            echo "PAT_SET=0" >> "$GITHUB_ENV"
          fi

      - name: Assert the shared contract package is reachable
        # Runs AFTER the step above, so it tests reachability with whatever credential
        # is actually configured - which is what makes its two error messages able to
        # tell "the repo is private and nothing is set" from "the token is wrong".
        #
        # It exists because pip's own failure is `fatal: could not read Username for
        # 'https://github.com'`, which names neither the repository nor the setting that
        # caused it. That cost nine minutes and a wrong first diagnosis on 2026-08-26 -
        # the stale `jayakumard10` owner in the URL looks like the culprit and is not,
        # since the rename redirect resolves fine. This costs about a second.
        run: |
          URL=$(grep -oE 'https://github\.com/[^@]+\.git' requirements.txt | head -1)
          echo "checking access to $URL"
          # GIT_TERMINAL_PROMPT=0 so a private repo fails immediately instead of blocking
          # on a username prompt - the same thing that makes pip's own error so unhelpful.
          export GIT_TERMINAL_PROMPT=0

          # Show what git was actually configured to do. Secrets are masked as *** in
          # Actions logs, so this reveals whether the rewrite exists without revealing
          # the token. An earlier version of this step swallowed git's stderr entirely
          # and asserted a cause with no evidence for it - which is how a check ends up
          # confidently naming the wrong thing.
          echo "--- configured url rewrites ---"
          git config --global --get-regexp '^url\.' || echo "(none configured)"
          echo "--- git ls-remote ---"
          # Capture stderr so the branch below can read *which* refusal this was. The two
          # look alike and mean opposite things, and telling them apart is the difference
          # between regenerating a token and editing its repository access.
          if err=$(git ls-remote "$URL" 2>&1 >/dev/null); then
            echo "reachable"
          elif [ "$PAT_SET" = "1" ]; then
            echo "$err"
            if echo "$err" | grep -qi "not found"; then
              # GitHub answers 404, not 403, for a repository a fine-grained token cannot
              # see - deliberately, so it does not leak whether the repo exists. So this
              # is NOT an auth failure: the credential was accepted. The token simply has
              # no access to this repository.
              echo "::error::The token in EVENTBUS_READ_PAT authenticated successfully, \
          but has no access to agentic-sdlc-eventbus - GitHub answers 'Repository not \
          found' rather than 'denied' for a repo a fine-grained token cannot see, so this \
          is a SCOPE problem and not an expiry or credential problem. Do not regenerate \
          it. Edit the token at Settings > Developer settings > Fine-grained tokens: set \
          Repository access to 'Only select repositories' and include \
          agentic-sdlc-eventbus, with Contents: Read-only. The default, 'Public \
          repositories', cannot see a private repo, which is the usual cause."
            else
              echo "::error::The token in EVENTBUS_READ_PAT was rejected outright \
          ('Invalid username or token' or similar), so the credential itself is bad - \
          expired, revoked, or malformed. This one does need regenerating, unlike the \
          'Repository not found' case."
            fi
            exit 1
          else
            echo "::error::$URL is not readable anonymously and EVENTBUS_READ_PAT is not \
          set, so agentic-sdlc-eventbus is private with no credential available. Either \
          set that secret (fine-grained, read-only, scoped to that repo) under Settings > \
          Secrets and variables > Actions, or make the repository public. Either works - \
          see ADR-0015. Without one, the install below fails with a misleading 'could not \
          read Username' error that names none of this."
            exit 1
          fi

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        # Measured 91% with the postgres service container attached (257 tests, no
        # skips). The floor sits just under it so coverage can only ratchet up.
        #
        # It also catches a failure mode a bare `pytest` hides: without a reachable
        # postgres the durability tests skip and coverage falls to 88%, so a run
        # where the service container never came up fails here instead of passing
        # quietly with the property those tests exist to prove left unverified.
        run: pytest --cov=agentic_control_plane --cov-report=term-missing --cov-fail-under=90

      - name: Assert every mermaid diagram parses
        # "The diagrams render on GitHub" has broken three times, and every time the
        # repository looked fine locally while GitHub showed "Unable to render rich
        # display" to anyone browsing it. Parsing is cheap and catches the whole class
        # seen so far; rendering needs a headless browser and is not worth the fragility.
        run: |
          npm install --no-fund --no-audit --no-save mermaid jsdom
          node scripts/validate-mermaid.mjs

      - name: Assert the platform carries no tenant-specific vocabulary
        # This repo is domain-agnostic by requirement, not by convention. Checked
        # here so a regression fails a build rather than waiting for review.
        #
        # Scope is the package and its tests, deliberately - not the whole repo.
        # scripts/ holds cross-repo demo tooling that must know every repository by
        # name, including tenant specifics, because demonstrating a platform needs a
        # concrete tenant to demonstrate it against. That tooling is never imported
        # by the package, which is where the rule actually applies.
        #
        # *** THIS IS A DENYLIST. IT ONLY CATCHES TENANTS SOMEONE REMEMBERED TO ADD. ***
        #
        # It carried only the url-shortener's words from the day it was written until
        # 2026-08-26, while this platform's second tenant - COBOL/mainframe modernization -
        # had been live for months. A green build meant "no url-shortener vocabulary",
        # never "domain-agnostic", and nothing about the green said which.
        #
        # Maintenance rule: **a tenant joining this platform adds its vocabulary here in
        # the same change.** If you are adding tenant #3, consider whether a denylist is
        # still the right shape: once Track P1 lands config/scenario_specialists.yaml,
        # these terms could be derived from the specialists actually configured, which
        # would make a new tenant loud instead of silent.
        run: |
          # Tenant 1 - url-shortener-api.
          TENANT_1='url.?shorten|shortened|short.?url|qr.?code|click.analytics'

          # Tenant 2 - COBOL/mainframe modernization (cobol-modernizer, card-service).
          #
          # `pic` is the one that needs care and it took two tries. Matched only as a real
          # picture clause - `PIC X(10)`, `PIC S9(9) COMP-3`, `PIC clause` - never bare and
          # never as `pic(`: the first draft used `pic\s*\(`, which matched **"topic("** and
          # failed the build on two existing test names. A guard that cries wolf gets
          # switched off, which would be worse than the gap this step is closing. Word
          # boundaries on the short acronyms for the same reason.
          #
          # Verified both directions before commit: eleven real COBOL forms caught, and
          # "topic(", "typical picture", "epic", "pick a value", "os.path" and "graphics
          # pipeline" all left alone.
          TENANT_2='cobol|copybook|carddemo|mainframe|\bjcl\b|\bvsam\b|\bcics\b|\bpic\s+[9xsavnzp]|\bpic\s+clause|\bz/?os\b'

          if grep -rniE "$TENANT_1|$TENANT_2" agentic_control_plane/ tests/; then
            echo "::error::tenant-specific vocabulary found in a domain-agnostic repo"
            exit 1
          fi
          echo "clean"

  compose-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Write local secret files for compose
        env:
          EVENTBUS_READ_PAT: ${{ secrets.EVENTBUS_READ_PAT }}
        run: |
          # postgres_password is a placeholder: nothing here authenticates with it.
          #
          # github_pat is NOT a placeholder any more (ADR-0015). It is now also a
          # *build* secret, because a private agentic-sdlc-eventbus needs a credential
          # to resolve agentic-events. So this writes the real EVENTBUS_READ_PAT when
          # one is configured, and writes an EMPTY file when one is not -- the
          # Dockerfile tests `-s` and skips the git config entirely on an empty file,
          # falling through to anonymous HTTPS. A placeholder string would be worse
          # than nothing: it is non-empty, so the build would configure git with a
          # credential that cannot authenticate.
          #
          # secrets/*.txt is gitignored, so nothing written here can be committed.
          mkdir -p secrets
          printf '%s' "$EVENTBUS_READ_PAT" > secrets/github_pat.txt
          printf 'ci_local_password' > secrets/postgres_password.txt
          if [ -s secrets/github_pat.txt ]; then
            echo "build secret present"
          else
            echo "build secret empty - anonymous build (requires a public eventbus)"
          fi

      - name: Start this service's own Postgres
        run: docker compose up -d postgres

      - name: Wait for postgres healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect --format='{{.State.Health.Status}}' agentic-sdlc-control-plane-postgres || echo starting)"
            echo "attempt $i: $status"
            if [ "$status" = "healthy" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "postgres never became healthy" >&2
          docker compose logs
          exit 1

      - name: Build the consumer image
        # Build only: the consumer needs a live event bus to do anything, and this
        # repo is independently clonable with no sibling checkout, so there is no
        # broker to point it at here. Cross-repo behaviour is verified locally
        # against a real broker instead - see the README.
        run: docker compose build consumer

      - name: Assert the built image carries no credential
        # Kept deliberately after the build-time PAT was removed. Nothing writes a
        # credential into this image today, so this passes trivially - which is the
        # point: it is a regression guard. This image is the one that handles a real
        # PAT at runtime, so a build step that quietly reintroduced one would ship
        # it, and would otherwise be caught by nobody.
        run: |
          size=$(docker run --rm agentic-sdlc-control-plane-consumer:latest \
            sh -c 'stat -c %s /root/.gitconfig 2>/dev/null || echo 0')
          echo "/root/.gitconfig is $size bytes"
          if [ "$size" != "0" ]; then
            echo "::error::build credential persisted into the image"
            docker run --rm agentic-sdlc-control-plane-consumer:latest cat /root/.gitconfig
            exit 1
          fi

      - name: Tear down
        if: always()
        run: docker compose down -v
