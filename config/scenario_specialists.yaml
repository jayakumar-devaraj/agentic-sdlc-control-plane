# Which generator produces code for a run, and with what model.
#
# THIS FILE IS THE ONLY PLACE IN THIS REPOSITORY WHERE A TENANT IS NAMED IN A WAY THE
# RUNTIME READS. That is the point of it. ADR-0001 requires the package to be
# domain-agnostic and CI fails the build when `agentic_control_plane/` or `tests/`
# carries tenant vocabulary, so the routing table is data and the resolver that reads
# it (`agentic_control_plane/specialists.py`) knows nothing about what is in it.
#
# Schema, resolution rules and the reasoning behind both: docs/adr/0016.
#
# Override the whole file with SPECIALIST_ROUTING_FILE to route a deployment
# differently without rebuilding the image. Delete it, or mount an empty path over it,
# and every run takes `default` below - which is exactly the behaviour this repository
# had before routing existed.

version: 1

specialists:
  # The general-purpose generator built into the Coder node: one `claude` CLI call
  # asking for a {path: contents} object. `model` and `cli_timeout_seconds` were
  # module constants in nodes/coder.py until ADR-0016; the values here are those
  # constants, unchanged, because a routing refactor must not change what a working
  # deployment does. `default` is required, must be `builtin`, and is what any target
  # with no matching route below resolves to.
  default:
    kind: builtin
    model: claude-sonnet-5
    # 300s was too tight for a retry prompt covering several files - a genuine timeout
    # (not a hang) was observed during brownfield fixture capture.
    cli_timeout_seconds: 480

  # A legacy-modernization specialist: a separately released tool with two bounded
  # subcommands, its own prompts and model configuration, and its own build-and-heal
  # loop. Not a prompt variation on the generator above - a different program.
  #
  # `requires` is not aspirational. It is the provisioning list that repository's
  # ADR-0055 named for whatever invokes it, and this image (python:3.12-slim) carries
  # none of it. The resolver checks these before invoking anything and reports what is
  # absent by name; a specialist-capable deployment is a customised image, not a
  # config toggle.
  #
  # `distribution` is the pinned requirement ADR-0055 decided, and it is a real tag rather
  # than a placeholder: `v0.3.0`, cut 2026-09-04. Verified from a clean virtualenv before
  # being written here - the CLI starts, reads its own packaged prompts and Java baseline
  # with no checkout on any path, and that baseline's Maven wrapper resolves.
  #
  # **v0.3.0 rather than v0.2.0, and the reason is the run v0.2.0 produced.** v0.2.0 closed the
  # defect where a generated processor computed a value and discarded it. The first live run on
  # it then produced a second defect one level up: the processor returned the value, and set a
  # per-account running total to the current row's amount. An account with four category rows
  # would be posted the last row's interest instead of the sum. That specialist's ADR-0063
  # records why no component was at fault again - v0.2.0's rule *required* it, because the
  # accumulated value escapes the paragraph that computes it and the rule therefore demanded the
  # producing step return it, which a stateless processor can only do by inventing a total.
  # v0.3.0 excuses it there and refuses it there. A deployment pinning v0.2.0 still generates the
  # wrong total, and this service cannot see the difference: it compiles and the phase succeeds.
  #
  # **v0.2.0 rather than v0.1.2 closes a defect that survived a human approving it.** The
  # first end-to-end run against a tenant repository generated a processor that computed a
  # monthly interest and discarded it - legal Java, a clean compile, and a comment claiming
  # the value had been accumulated. No component was at fault: that repository's design
  # document had no way to express a type carrying a value no record holds, so its architect
  # designed the only expressible thing and its renderer emitted exactly what was designed.
  # Its ADR-0062 gives the design a word for such a value and refuses a step that computes
  # one it cannot return, at the point the design is produced rather than three layers later.
  # A deployment pinning v0.1.2 still produces the discarding processor, and this service
  # cannot see the difference: the artifact compiles and the phase reports success.
  #
  # **v0.1.2 rather than v0.1.1 is what makes a specialist run observable at all.** That
  # repository's ADR-0046 decided to emit OpenTelemetry spans from `call_model` and its two
  # CLI entrypoints; until its PR #104 the decision was accepted and unimplemented, and the
  # only instrumentation that existed was a local dev-harness monkey-patch loaded by
  # `langgraph dev`. This image runs the CLI, not that harness, so a deployment pinning
  # v0.1.1 emits no spans however it is configured. Tracing is off unless the environment
  # names a collector, so the pin costs nothing when it is not wanted - see
  # `docker-compose.specialist.yml` for the two variables that turn it on.
  #
  # **It says v0.1.1 rather than v0.1.0 because the difference is not cosmetic.** `v0.1.0`,
  # the first ref that repository published, was cut hours before its PR #102 merged, so the
  # tag does not contain ADR-0059: the refusal of a `step_name` Java cannot take, and the
  # `solution_architect` v1_1_0 prompt that states the rule. A deployment pinning v0.1.0
  # installs a specialist that will emit `compute-monthly-interest` and discover the problem
  # at render time, after a human has approved the design that contains it. The clean-virtualenv
  # check above is what caught it: `node_prompt_version('solution_architect')` reports the
  # version the node actually sends, and on v0.1.0 that is v1_0_0.
  #
  # `Dockerfile.specialist` takes this same string as SPECIALIST_REQUIREMENT (ADR-0017), and
  # `docker-compose.specialist.yml` passes it. The two must agree: a routing table naming a
  # tag the image did not install fails after the design gate, not before it.
  cobol-modernizer:
    kind: external
    command: cobol-modernizer
    distribution: "cobol-modernizer @ git+https://github.com/jayakumar-devaraj/agentic-sdlc-cobol-modernizer@v0.3.0"
    phases:
      design:
        # `--programs` is REQUIRED by this specialist, and control-plane cannot supply it.
        # ADR-0018 fixes what control-plane appends at four flags, and a COBOL program name is
        # tenant vocabulary that ADR-0001 forbids the package from carrying. So it lives here,
        # as data - which is exactly what per-phase `args` is for. See ADR-0023.
        #
        # Found by running it, 2026-08-28. The first real invocation exited 2 in three seconds
        # with `error: the following arguments are required: --programs`, before a single model
        # call. Every test that predates it drove a stand-in accepting the four flags and asking
        # for nothing else, so both sides looked complete from inside themselves.
        #
        # ONE program, not the four the specialist's own `--help` shows as an example. G7 closes
        # against a named instance rather than a mechanism, and a first run migrating four
        # programs cannot say which of them the platform actually handles.
        args: [design, --programs, CBACT04C]
        requires:
          executables: [claude]
      generate:
        args: [generate]
        requires:
          # The Java baseline's own test uses Testcontainers, hence the daemon.
          #
          # **Observed 2026-08-28 and deliberately left as it is.** The first real run of this
          # phase compiled and did not test - 15 main classes, 0 test classes, no surefire
          # directory - so Testcontainers never started and the daemon went unused. Two reasons
          # not to drop the requirement on that evidence: it is the specialist's own declared
          # provisioning list (that repo's ADR-0055) and this file should not overrule another
          # repository's statement of what it needs from one observation of one version; and a
          # phase that compiles today may test tomorrow, at which point a deployment that was
          # allowed to skip the daemon fails deep inside Maven instead of at the preflight.
          #
          # It does mean the preflight currently demands something this phase does not use. That
          # is the conservative direction to be wrong in, and it is written down rather than
          # discovered. ADR-0025.
          executables: [claude, java, mvn]
          docker_daemon: true

# Matched on the target repository - the last path segment of the workspace's `origin`
# remote, minus any `.git`, compared case-insensitively. `scenario` is a label for the
# audit trail; it selects nothing. A repository may appear at most once.
routes:
  - scenario: legacy-batch-modernization
    repository: carddemo-tenant-service
    specialist: cobol-modernizer
    # Generated code goes to a DIFFERENT project from the one matched above, which stays
    # read-only for the whole run (ADR-0009). Naming it here is what makes publishing possible
    # at all - a route without it runs and publishes nothing, which is the default for a reason.
    #
    # Reaching it needs two things this file cannot supply: a write-scoped GIT_PAT_FILE, since
    # this repository is private, and PUBLISH_MODE set to something other than `none`. Both are
    # deployment decisions, and `none` means the change is committed in the run's own checkout
    # and reported, never pushed (ADR-0012).
    output_repository: https://github.com/jayakumar-devaraj/card-service.git
    output_branch: main
